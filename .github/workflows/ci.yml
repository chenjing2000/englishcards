name: Windows CI

on:
  push:
    branches:
      - main
      - feature/article-v6-editor
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build React frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify browser render demo
        run: npm run demo

      - name: Run Playwright end-to-end tests
        run: npm run test:e2e

      - name: Run Windows .NET tests
        run: dotnet run --project EnglishCards.Tests/dotnet/EnglishCards.Tests.csproj -c Release

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            .build/test-results/
            .build/verification/e2e.json
          if-no-files-found: ignore
          retention-days: 14
